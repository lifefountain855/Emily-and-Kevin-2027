kind = "web"
previewPath = "/"
title = "Emily & Kevin's Wedding"
version = "1.0.0"
id = "artifacts/wedding-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23245

[services.development]
run = "pnpm --filter @workspace/wedding-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding-website", "run", "build" ]
publicDir = "artifacts/wedding-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23245"
BASE_PATH = "/"
